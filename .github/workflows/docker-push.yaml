name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name'
        required: true
        type: string
      registry:
        description: 'Container registry'
        default: 'ghcr.io'
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        default: 'Dockerfile'
        type: string
      context:
        description: 'Build context'
        default: '.'
        type: string
      push:
        description: 'Push image to registry'
        default: true
        type: boolean
      platforms:
        description: 'Target platforms'
        default: 'linux/amd64'
        type: string
    secrets:
      registry-username:
        description: 'Registry username'
        required: false
      registry-password:
        description: 'Registry password'
        required: false
      gcp-service-account-key:
        description: 'GCP Service Account Key JSON (for Google Artifact Registry)'
        required: false
      gcp-workload-identity-provider:
        description: 'GCP Workload Identity Provider (alternative to service account key)'
        required: false
      gcp-service-account:
        description: 'GCP Service Account email (used with Workload Identity)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: inputs.push && startsWith(inputs.registry, 'us-docker.pkg.dev')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.gcp-service-account-key }}

      - name: Set up Cloud SDK
        if: inputs.push && startsWith(inputs.registry, 'us-docker.pkg.dev')
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: inputs.push && startsWith(inputs.registry, 'us-docker.pkg.dev')
        run: gcloud auth configure-docker us-docker.pkg.dev

      - name: Log in to registry (GitHub/DockerHub)
        if: inputs.push && !startsWith(inputs.registry, 'us-docker.pkg.dev')
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max