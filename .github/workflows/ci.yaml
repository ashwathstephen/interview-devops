name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-push.yaml
    with:
      image-name: interview-go-app
      registry: us-docker.pkg.dev/devops-interview-487605/docker-repo
      dockerfile: Dockerfile
      context: .
      push: true
      platforms: linux/amd64
    secrets: inherit